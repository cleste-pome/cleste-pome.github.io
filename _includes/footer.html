{% if site.visitor_map.enabled %}
<!--
  访客地图
  这是一个静态站点，本身没法记录访客来源，必须借助第三方服务。
  把服务商给的嵌入代码粘贴到下面 visitor-footer__map 里的标记处。
  详细步骤见 README 的「页脚访客地图」一节。
-->
<footer class="visitor-footer" role="contentinfo">
  <div class="visitor-footer__inner">

    {% if site.visitor_map.title %}
      <h4 class="visitor-footer__title">{{ site.visitor_map.title }}</h4>
    {% endif %}

    {% if site.visitor_map.subtitle %}
      <p class="visitor-footer__subtitle">{{ site.visitor_map.subtitle }}</p>
    {% endif %}

    <div class="visitor-footer__map">
      <!-- ▼▼▼ 访客地图嵌入代码粘贴处 ▼▼▼ -->

      <!-- ▲▲▲ 粘贴结束 ▲▲▲ -->
    </div>

  </div>
</footer>
{% endif %}
