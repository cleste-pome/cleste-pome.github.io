{% if site.visitor_map.enabled %}
<!--
  页脚访客地图
  静态站点自己无法记录访客来源，这里走的是两条免注册的公开接口：
    · 访客国家：Cloudflare trace（失败退回 ipwho.is）
    · 计数存储：Abacus（免费计数 API）
  逻辑在 assets/js/visitor-map.js，样式在 _sass/_footer.scss 的 .visitor-footer
-->
<footer class="visitor-footer" role="contentinfo">
  <div class="visitor-footer__inner">

    {% if site.visitor_map.title %}
      <h4 class="visitor-footer__title">{{ site.visitor_map.title }}</h4>
    {% endif %}

    <div class="visitor-map">
      <div class="visitor-map__stage">
        <img class="visitor-map__base"
             src="{{ '/assets/img/world-dots.svg' | relative_url }}"
             alt="" aria-hidden="true" loading="lazy">
        <svg class="visitor-map__dots" viewBox="0 0 1440 720" aria-label="访客来源地图"></svg>
      </div>

      <p class="visitor-map__stat">
        <span data-visitor-stat>—</span>{% if site.visitor_map.subtitle %} &middot; {{ site.visitor_map.subtitle }}{% endif %}
      </p>
    </div>

  </div>
</footer>
{% endif %}
